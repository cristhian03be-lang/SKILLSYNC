name: CI
on: [push, pull_request]
jobs:
  secretos:
    # REQ-05: el pipeline falla si se sube una credencial (MONGO_URI, JWT_SECRET, llaves)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: encaja-mern/encaja-mern/server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm test
  cliente:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: encaja-mern/encaja-mern/client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build
